# (backend/model-client-grpc-benchmark) TorchServe 로컬 실측용 설정.
#
# 기본 포트(REST 8080/8081/8082, gRPC 7070/7071)를 그대로 쓰지 않는 이유: 이 환경(WSL2 미러링
# 네트워킹)에서 Docker Desktop(com.docker.backend)이 이미 8080을 쓰고 있어 충돌한다 — 이 프로젝트의
# 기존 관례(포트 충돌은 회피, docs/sessions 세션 로그 다수 참고)를 그대로 따라 전용 포트대로 옮긴다.
# 0.0.0.0으로 바인딩하는 이유: 이 TorchServe는 WSL(Ubuntu-24.04) 안에서 뜨고, 실측 대상인
# Spring Boot 앱은 Windows 쪽에서 뜬다 — WSL2의 localhost 포워딩이 127.0.0.1 바인딩까지는
# 항상 커버해주지 않아서(실제로 겪음, docs/sessions 세션 로그 참고), Windows에서 WSL 인스턴스의
# IP(`wsl hostname -I`)로 직접 접근할 수 있도록 전체 인터페이스에 바인딩한다.
inference_address=http://0.0.0.0:18280
management_address=http://0.0.0.0:18281
metrics_address=http://0.0.0.0:18282
# gRPC 바인딩 주소는 inference_address와 별개 속성(grpc_inference_address)으로 관리된다 —
# 기본값이 127.0.0.1이라 REST와 똑같이 명시적으로 0.0.0.0을 줘야 한다(TorchServe
# ConfigManager.java의 getGRPCAddress() 참고).
grpc_inference_address=0.0.0.0
grpc_management_address=0.0.0.0
grpc_inference_port=17070
grpc_management_port=17071
