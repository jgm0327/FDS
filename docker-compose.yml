# 로컬 검증용 단일 브로커 Kafka (KRaft 모드, ZooKeeper 불필요).
# application.yml의 replication-factor 기본값(3)은 다중 브로커 운영 환경 기준이므로,
# 이 단일 브로커 compose로 검증할 때는 FDS_KAFKA_REPLICATION_FACTOR=1 로 오버라이드해서 실행한다.
#
#   FDS_KAFKA_REPLICATION_FACTOR=1 ./gradlew bootRun
#
services:
  kafka:
    image: apache/kafka:latest
    container_name: fds-v2-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "fds-v2-local-cluster"
