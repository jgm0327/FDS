spring:
  application:
    name: fds-v2-backend
  data:
    # CP3 — 온라인 피처 스토어 (docs/BACKEND.md CP3 참고). StringRedisTemplate은 Spring Boot가
    # 이 설정만으로 자동 구성해준다 — 별도 @Configuration 불필요.
    redis:
      host: ${FDS_REDIS_HOST:localhost}
      port: ${FDS_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # CP3 — account-feature-updates 토픽을 구독해서 Redis에 쓰는 싱크 컨슈머 전용 설정.
    # 키/값 모두 String으로 그대로 읽는다 — CP2의 AccountFeatureVector Java 타입에 의존하지 않고
    # JSON 원문을 그대로 Redis에 저장하기 위함 (두 브랜치가 "토픽 스키마(JSON 형태)"로만
    # 연결되게 하려는 의도, docs/WORKTREE_SETUP.md 병렬 브랜치 원칙 참고).
    consumer:
      group-id: fds-v2-redis-feature-sink
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    # CP2 — 계좌별 슬라이딩 윈도우 집계 토폴로지 (docs/BACKEND.md CP2 참고).
    # CP1의 임시 검증 컨슈머(TransactionEventConsumer, spring.kafka.consumer.* 설정을 썼음)는
    # 이 토폴로지로 교체되면서 제거했다 — 이제 transaction-events를 읽는 건 아래 streams 설정뿐이다.
    # application-id는 컨슈머 그룹 역할 + changelog/repartition 토픽 이름 접두사로도 쓰이므로
    # spring.application.name에 묻어가지 않고 명시적으로 지정한다.
    # bootstrap-servers는 위 spring.kafka.bootstrap-servers를 자동 상속하므로 여기서 반복하지 않는다.
    streams:
      application-id: fds-v2-streams-app
      # RocksDB state store 로컬 경로. Windows 로컬 개발 편의를 위해 상대경로를 기본값으로 두고,
      # 운영/컨테이너 환경에서는 env var로 오버라이드한다.
      state-dir: ${FDS_KAFKA_STREAMS_STATE_DIR:./data/kafka-streams}
      properties:
        # CP2 패널 확장(docs/PERFORMANCE_MEASUREMENT.md) — 기본값(INFO)에서는 RocksDB 지표가
        # 아예 기록되지 않는다. DEBUG로 올려야 State Store put/get latency 등을 볼 수 있다.
        # (레코드 처리 latency/changelog lag/리밸런싱 지표는 INFO에서도 이미 노출됨.)
        # 코드 리뷰 지적: DEBUG는 지표 계산 오버헤드가 있고 이번에 겪은 "이름과 실제 의미가 다른
        # 지표가 음수를 내는" 문제의 노출 범위이기도 하므로, 운영에서 끄고 싶을 때 코드 수정 없이
        # env var로 되돌릴 수 있게 함 (CP1에서 세운 "코드 수정 없이 조정 가능하게" 원칙과 동일).
        metrics.recording.level: ${FDS_KAFKA_STREAMS_METRICS_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      # CP4 관측 확장(backend/model-client-observability) — 기본값(false)이면 Resilience4j
      # CircuitBreaker 호출 Timer(resilience4j.circuitbreaker.calls)가 count/sum만 남기고 분위수
      # 버킷을 안 만들어서 Grafana에서 p50/p95/p99를 histogram_quantile로 못 뽑는다. CP2가 Kafka
      # Streams RocksDB 지표를 보려고 metrics.recording.level을 DEBUG로 올렸던 것과 같은 이유로,
      # 여기서도 명시적으로 켠다.
      percentiles-histogram:
        resilience4j.circuitbreaker.calls: true

# FDS v2 전용 설정 — docs/BACKEND.md 구현 스펙 참고
fds:
  kafka:
    transaction-events:
      # 파티션 수/복제 계수는 코드 수정 없이 이 값(또는 아래 env var)만 바꿔서 조정한다.
      # 파티션 수는 운영 중 늘리면 accountId-파티션 매핑이 깨지므로, 트래픽이 없는 지금
      # 단계에서만 유연하게 조정 가능한 값으로 취급한다 (docs/BACKEND.md 핵심 설계 결정 1번).
      topic-name: ${FDS_KAFKA_TOPIC_NAME:transaction-events}
      partitions: ${FDS_KAFKA_PARTITIONS:32}
      # 로컬 단일 브로커 docker-compose로 검증할 때는 FDS_KAFKA_REPLICATION_FACTOR=1 로 오버라이드.
      replication-factor: ${FDS_KAFKA_REPLICATION_FACTOR:3}
      salting:
        # (backend/kafka-salting) CP1 hot-partition 세션(2026-09-10 e2e 검증)에서 실측으로 확인한
        # 문제(핫 계좌 하나가 파티션 하나를 독점, 컨슈머 인스턴스를 늘려도 안 풀림)의 실제 해법 —
        # docs/ARCHITECTURE.md 1번 "대응 1: Salting". 여기 등록된 계좌만 여러 서브샤드로 트래픽을
        # 분산한다. 콤마로 구분한 accountId 목록, 기본값은 비어있음(전부 일반 계좌 취급 — 기존과
        # 100% 동일한 동작, TransactionEventProducer/AccountShardKey 클래스 javadoc 참고).
        high-traffic-account-ids: ${FDS_KAFKA_SALTING_HIGH_TRAFFIC_ACCOUNT_IDS:}
        # 고빈도 계좌 하나를 몇 개 서브샤드로 나눌지. CP1이 이미 파티션 32개를 확보해뒀으니(넉넉하게
        # 시작 -> 실측 후 조정 원칙), 그 안에서 감당 가능한 값으로 8을 기본값으로 잡았다.
        shard-count: ${FDS_KAFKA_SALTING_SHARD_COUNT:8}
    # CP2 출력 — 계좌별 피처 벡터. CP3(Redis 피처 스토어, 별도 브랜치)가 이 토픽을 구독한다.
    # 파티션 수는 입력 토픽과 동일하게 맞춰서 계좌ID 기준 설정 일관성을 유지한다
    # (Redis 조회 자체는 파티션과 무관하지만, 두 토픽의 설정을 따로 관리할 이유가 없음).
    feature-updates:
      topic-name: ${FDS_KAFKA_FEATURE_TOPIC_NAME:account-feature-updates}
      partitions: ${FDS_KAFKA_PARTITIONS:32}
      replication-factor: ${FDS_KAFKA_REPLICATION_FACTOR:3}
  sequence-aggregation:
    # 슬라이딩 윈도우 크기(분). ARCHITECTURE.md/PERFORMANCE_MEASUREMENT.md의 "최근 5분" 예시를 기본값으로.
    recent-window-minutes: ${FDS_RECENT_WINDOW_MINUTES:5}
  feature-store:
    # docs/ARCHITECTURE.md 3번 — 키: feature:account:{accountId}
    key-prefix: ${FDS_FEATURE_STORE_KEY_PREFIX:feature:account:}
    # TTL(분). 거래가 계속 들어오면 매번 같은 키에 덮어쓰며 TTL도 리셋되므로, 활발한 계좌는 사실상
    # 삭제되지 않는다. 30분간 거래가 없으면 자동 삭제(ARCHITECTURE.md 예시값 그대로).
    ttl-minutes: ${FDS_FEATURE_STORE_TTL_MINUTES:30}
    # CP4(ai/pytorch-sequence-model) 연동 — 스냅샷과 별개로 유지하는 "최근 거래 시퀀스" Redis LIST의
    # 최대 길이. ai/pytorch_sequence_model/config.py의 MAX_SEQ_LEN과 반드시 같은 값이어야 한다
    # (backend/sequence-window-feature-store 세션 로그 참고) — 한쪽만 바꾸면 서빙 시점에 모델이
    # 기대하는 컨텍스트 길이와 실제로 주어지는 시퀀스 길이가 어긋난다.
    recent-window-size: ${FDS_FEATURE_STORE_RECENT_WINDOW_SIZE:30}
    # account-feature-updates가 32개 파티션이라, concurrency 없이는 컨슈머 스레드 하나가 전부
    # 처리한다(코드 리뷰 지적) — 넉넉하게 시작해서 실측 후 조정 (docs/BACKEND.md 핵심 설계 결정 1번과
    # 같은 원칙).
    consumer-concurrency: ${FDS_FEATURE_STORE_CONSUMER_CONCURRENCY:4}
    # CP3 패널 확장(측정 전용) — FeatureQueryController(GET /api/features/{accountId})를 켤지 여부.
    # 기본 false: 인증 없이 계좌 피처를 조회할 수 있는 API라 CP4가 나오기 전까지 프로덕션에 실수로
    # 남아있으면 안 된다(코드 리뷰 지적). k6로 CP3 지표를 측정할 때만 true로 켠다.
    query-endpoint-enabled: ${FDS_FEATURE_STORE_QUERY_ENDPOINT_ENABLED:false}
  model-serving:
    # CP4 model-client (backend/model-client) — ModelInferenceClient가 실제로 이 값들을 쓴다.
    # base-url/timeout-ms 자리는 CP1 세션에서 미리 잡아뒀던 것 그대로 재사용 (docs/BACKEND.md
    # 핵심 설계 결정 4번 — REST 먼저, gRPC는 다음 단계).
    torchserve:
      base-url: ${TORCHSERVE_BASE_URL:http://localhost:8080}
      # connect/read timeout 둘 다 이 값 하나로 통일한다 — RestClientTorchServeHttpCaller
      # 클래스 javadoc 참고 (Circuit Breaker가 열리는 시점을 이 한 값만으로 예측 가능하게).
      timeout-ms: ${TORCHSERVE_TIMEOUT_MS:300}
      # ai/pytorch_sequence_model/serving/export.py가 torch-model-archiver에 넘기는
      # --model-name과 반드시 같아야 한다 (다르면 TorchServe가 404를 낸다).
      model-name: ${TORCHSERVE_MODEL_NAME:fds-sequence-model}
      # (backend/model-client-grpc-benchmark) rest(기본) | grpc — 둘 중 어느 TorchServeHttpCaller
      # 구현체가 활성화되는지 결정한다. RestClientTorchServeHttpCaller/GrpcTorchServeHttpCaller의
      # @ConditionalOnProperty 참고.
      protocol: ${TORCHSERVE_PROTOCOL:rest}
      # TorchServe는 기본적으로 REST(8080)와 gRPC(7070)를 같은 프로세스에서 함께 띄운다
      # (ai/README.md TorchServe 배포 절 — 별도 설정 없이도 둘 다 열린다).
      grpc-host: ${TORCHSERVE_GRPC_HOST:localhost}
      grpc-port: ${TORCHSERVE_GRPC_PORT:7070}
      circuit-breaker:
        # 최근 sliding-window-size건 중 이 비율(%) 이상 실패하면 OPEN.
        failure-rate-threshold: ${TORCHSERVE_CB_FAILURE_RATE_THRESHOLD:50}
        # OPEN 상태를 유지하는 시간(초) — 이 시간 동안은 호출 자체를 안 하고 바로 폴백.
        wait-duration-in-open-state-seconds: ${TORCHSERVE_CB_WAIT_DURATION_SECONDS:10}
        sliding-window-size: ${TORCHSERVE_CB_SLIDING_WINDOW_SIZE:20}
        # 이 값보다 호출 횟수가 적으면 실패율 계산 자체를 안 해서(신뢰 구간 부족), 초반에
        # 우연히 몇 번 실패했다고 바로 OPEN되는 걸 방지한다.
        minimum-number-of-calls: ${TORCHSERVE_CB_MINIMUM_CALLS:10}
        # HALF_OPEN 상태에서 "시험 호출"로 몇 건까지 동시에 흘려보낼지. resilience4j 기본값(10)을
        # 그대로 두면, 동시 요청이 많은 상황(k6 부하테스트 등)에서 회복 시도 자체가 TorchServe
        # 단일 워커에 다시 부하를 몰아줘서 영원히 OPEN에서 못 벗어나는 걸 실측으로 확인했다
        # (ModelClientConfig 클래스 javadoc, 세션 로그 참고). 작게 잡아서 회복 시도의 부하 자체를
        # 줄인다.
        permitted-calls-in-half-open-state: ${TORCHSERVE_CB_PERMITTED_CALLS_HALF_OPEN:3}
      bulkhead:
        # (backend/model-client-concurrency-fix) ModelClientConfig 클래스 javadoc 참고 — k6 10 VU
        # 동시 부하를 완전히 새로 띄운 환경에서 딱 한 번 재현한 결과, TorchServe 단일 워커
        # (minWorkers=maxWorkers=1)가 원인으로 확정됐다. 이 값은 실제 배포된 TorchServe 워커 수와
        # 반드시 같이 맞춰야 한다 — ai/README.md TorchServe 배포 절의 워커 수 설정 참고. 기본값 4는
        # 이번 재검증에서 실측으로 확인한 워커 수(4)에 맞춘 것이며, 워커 수를 바꾸면 이 값도 같이
        # 바꿔야 한다.
        max-concurrent-calls: ${TORCHSERVE_BULKHEAD_MAX_CONCURRENT_CALLS:4}
    # CP4 수동/부하 검증용(FraudScoreController) — 기본 false, CP3 query-endpoint-enabled와
    # 같은 이유(인증 없는 계좌별 조회 API가 프로덕션에 실수로 남는 것 방지).
    query-endpoint-enabled: ${FDS_MODEL_SERVING_QUERY_ENDPOINT_ENABLED:false}
  decision:
    # CP5 — 판정 및 대응 (docs/ARCHITECTURE.md 5번). 규칙 엔진(하드룰 OR + 화이트리스트) + 모델
    # 확률 앙상블로 최종 액션(허용/추가인증/차단)을 정한다. 자동 트리거는 FraudDecisionEventListener
    # (CP3가 Redis 피처 스토어 갱신을 마치면 발행하는 이벤트를 구독) — 별도 활성화 플래그 없이
    # 항상 켜져 있다. 이 섹션 나머지는 그 판정 로직의 파라미터.
    #
    # 화이트리스트: 이 목록의 계좌는 모델 호출 없이 즉시 허용(ALLOW)한다 — 내부/테스트 계좌 등
    # 신뢰할 수 있다고 미리 알려진 계좌를 위한 것. 콤마로 구분한 accountId 목록.
    whitelisted-account-ids: ${FDS_DECISION_WHITELISTED_ACCOUNT_IDS:}
    # 하드룰 중 하나: 이 목록의 계좌는 모델 확률과 무관하게 즉시 차단(BLOCK)한다.
    blacklisted-account-ids: ${FDS_DECISION_BLACKLISTED_ACCOUNT_IDS:}
    # 하드룰 중 하나: 이번 거래 금액이 평소 대비 이 배율 이상이면서 동시에 국가가 바뀌었으면
    # 모델 확률과 무관하게 즉시 차단한다 (ARCHITECTURE.md 5번 "하드룰: OR 조건으로 즉시 반영" 예시를
    # 블랙리스트 외에 하나 더 구체화한 것).
    hard-block-amount-ratio-threshold: ${FDS_DECISION_HARD_BLOCK_AMOUNT_RATIO_THRESHOLD:20.0}
    ensemble:
      # 하드룰/화이트리스트에 안 걸린 애매한 구간 전용. combinedScore = modelWeight*모델확률 +
      # ruleWeight*규칙점수(RuleBasedFallbackScorer 재사용). 값의 근거는 정성적 직관이 아니라
      # ai/pytorch_sequence_model/tune_ensemble.py의 그리드서치 실측 결과다 — 합성 라벨
      # 데이터 기준 기대 비용이 기존 하드코딩값(0.7/0.3, 0.3/0.7) 대비 약 34% 낮다
      # (docs/sessions/2026-09-11_ai-ensemble-weight-tuning_session-01.md,
      # EnsembleFraudDecisionService 클래스 javadoc 참고).
      model-weight: ${FDS_DECISION_MODEL_WEIGHT:0.95}
      rule-weight: ${FDS_DECISION_RULE_WEIGHT:0.05}
      # combinedScore 임계값 — [0, low) ALLOW, [low, high) STEP_UP_AUTH(추가인증), [high, 1] BLOCK.
      low-threshold: ${FDS_DECISION_LOW_THRESHOLD:0.25}
      high-threshold: ${FDS_DECISION_HIGH_THRESHOLD:0.45}
    # CP5 수동/부하 검증용(FraudDecisionController) — CP3/CP4와 같은 이유로 기본 false.
    query-endpoint-enabled: ${FDS_DECISION_QUERY_ENDPOINT_ENABLED:false}
  feedback:
    # CP6 — 재학습 피드백 루프 (docs/ARCHITECTURE.md 6번, backend/feedback-loop 브랜치).
    # CP5 판정이 끝날 때마다 FeedbackDecisionRecorder가 이 값들로 "라벨 공개 예정 시각"을 정해
    # Redis에 대기시키고, FeedbackLabelScheduler가 만기된 항목을 JSONL 데이터셋으로 옮긴다.
    pending-key-prefix: ${FDS_FEEDBACK_PENDING_KEY_PREFIX:feedback:pending:}
    pending-index-key: ${FDS_FEEDBACK_PENDING_INDEX_KEY:feedback:pending:index}
    # 라벨(사기 확정/정상 확인)이 실제로는 시간~일 단위로 지연 도착하지만, 로컬 데모/검증이
    # 가능하도록 기본값은 짧게 잡았다(5~30분) — 실제 운영값으로 쓰려는 게 아니라 이 파이프라인의
    # "지연 도착 후 조인"이라는 동작 자체를 눈으로 확인하기 위한 값이다.
    pending-ttl-seconds: ${FDS_FEEDBACK_PENDING_TTL_SECONDS:5400}
    label-simulator:
      min-delay-seconds: ${FDS_FEEDBACK_LABEL_MIN_DELAY_SECONDS:300}
      max-delay-seconds: ${FDS_FEEDBACK_LABEL_MAX_DELAY_SECONDS:1800}
      # 대칭적 flip 확률 — "조사관도 완벽하지 않다"를 반영한 노이즈(SimulatedLabelHeuristic
      # 클래스 javadoc 참고). ai/pytorch_sequence_model/tune_ensemble.py의 CostWeights와 마찬가지로
      # 실제 데이터가 없어 가정한 값이다.
      flip-probability: ${FDS_FEEDBACK_LABEL_FLIP_PROBABILITY:0.05}
      # FeedbackLabelScheduler가 만기된 항목을 찾으러 도는 주기(ms).
      poll-interval-ms: ${FDS_FEEDBACK_LABEL_POLL_INTERVAL_MS:30000}
    # 조인 결과(JSONL) 출력 경로 — ai/artifacts와 같은 이유로 커밋하지 않는 로컬 산출물
    # (FeedbackDatasetWriter 클래스 javadoc 참고).
    dataset-output-path: ${FDS_FEEDBACK_DATASET_OUTPUT_PATH:data/feedback/labeled-dataset.jsonl}
