spring:
  application:
    name: fds-v2-backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    # CP2 — 계좌별 슬라이딩 윈도우 집계 토폴로지 (docs/BACKEND.md CP2 참고).
    # CP1의 임시 검증 컨슈머(TransactionEventConsumer, spring.kafka.consumer.* 설정을 썼음)는
    # 이 토폴로지로 교체되면서 제거했다 — 이제 transaction-events를 읽는 건 아래 streams 설정뿐이다.
    # application-id는 컨슈머 그룹 역할 + changelog/repartition 토픽 이름 접두사로도 쓰이므로
    # spring.application.name에 묻어가지 않고 명시적으로 지정한다.
    # bootstrap-servers는 위 spring.kafka.bootstrap-servers를 자동 상속하므로 여기서 반복하지 않는다.
    streams:
      application-id: fds-v2-streams-app
      # RocksDB state store 로컬 경로. Windows 로컬 개발 편의를 위해 상대경로를 기본값으로 두고,
      # 운영/컨테이너 환경에서는 env var로 오버라이드한다.
      state-dir: ${FDS_KAFKA_STREAMS_STATE_DIR:./data/kafka-streams}
      properties:
        # CP2 패널 확장(docs/PERFORMANCE_MEASUREMENT.md) — 기본값(INFO)에서는 RocksDB 지표가
        # 아예 기록되지 않는다. DEBUG로 올려야 State Store put/get latency 등을 볼 수 있다.
        # (레코드 처리 latency/changelog lag/리밸런싱 지표는 INFO에서도 이미 노출됨.)
        metrics.recording.level: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

# FDS v2 전용 설정 — docs/BACKEND.md 구현 스펙 참고
fds:
  kafka:
    transaction-events:
      # 파티션 수/복제 계수는 코드 수정 없이 이 값(또는 아래 env var)만 바꿔서 조정한다.
      # 파티션 수는 운영 중 늘리면 accountId-파티션 매핑이 깨지므로, 트래픽이 없는 지금
      # 단계에서만 유연하게 조정 가능한 값으로 취급한다 (docs/BACKEND.md 핵심 설계 결정 1번).
      topic-name: ${FDS_KAFKA_TOPIC_NAME:transaction-events}
      partitions: ${FDS_KAFKA_PARTITIONS:32}
      # 로컬 단일 브로커 docker-compose로 검증할 때는 FDS_KAFKA_REPLICATION_FACTOR=1 로 오버라이드.
      replication-factor: ${FDS_KAFKA_REPLICATION_FACTOR:3}
    # CP2 출력 — 계좌별 피처 벡터. CP3(Redis 피처 스토어, 별도 브랜치)가 이 토픽을 구독한다.
    # 파티션 수는 입력 토픽과 동일하게 맞춰서 계좌ID 기준 설정 일관성을 유지한다
    # (Redis 조회 자체는 파티션과 무관하지만, 두 토픽의 설정을 따로 관리할 이유가 없음).
    feature-updates:
      topic-name: ${FDS_KAFKA_FEATURE_TOPIC_NAME:account-feature-updates}
      partitions: ${FDS_KAFKA_PARTITIONS:32}
      replication-factor: ${FDS_KAFKA_REPLICATION_FACTOR:3}
  sequence-aggregation:
    # 슬라이딩 윈도우 크기(분). ARCHITECTURE.md/PERFORMANCE_MEASUREMENT.md의 "최근 5분" 예시를 기본값으로.
    recent-window-minutes: ${FDS_RECENT_WINDOW_MINUTES:5}
  model-serving:
    # 실제 ModelInferenceClient 연동은 다음 세션 범위. 지금은 설정값 자리만 미리 잡아둔다
    # (docs/BACKEND.md 핵심 설계 결정 4번 — REST 먼저, gRPC는 다음 단계).
    torchserve:
      base-url: ${TORCHSERVE_BASE_URL:http://localhost:8080}
      timeout-ms: ${TORCHSERVE_TIMEOUT_MS:300}
