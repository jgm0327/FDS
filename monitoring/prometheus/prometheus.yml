# CP1 측정용 Prometheus 설정 (docs/PERFORMANCE_MEASUREMENT.md, docs/MONITORING_SETUP.md 참고).
#
# Spring Boot 앱은 docker-compose 밖(호스트)에서 ./gradlew bootRun 으로 띄우는 구조라(session-02),
# Prometheus 컨테이너에서는 host.docker.internal로 접근한다 (Docker Desktop 전용 DNS 이름).
# 앱을 SERVER_PORT 오버라이드 없이 기본 포트(8080)로 띄웠다면 아래 타깃을 8080으로 바꿀 것 —
# 이 프로젝트의 로컬 컨벤션은 18080이다 (docs/sessions/2026-09-03_backend-kafka-partitioning_session-02.md).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fds-v2-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18080']
        labels:
          service: fds-v2-backend

  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: kafka-exporter

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis-exporter
