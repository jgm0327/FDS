# Grafana 부팅 시 monitoring/grafana/dashboards/ 아래 JSON 대시보드를 자동으로 불러온다.
apiVersion: 1

providers:
  - name: fds-v2
    orgId: 1
    folder: 'FDS v2'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
