plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	// (backend/model-client-grpc-benchmark) TorchServe 공식 gRPC 추론 API(src/main/proto/inference.proto)로부터
	// Java 클라이언트 스텁을 생성한다 — 서버가 아니라 클라이언트만 필요하므로 protoc + grpc-java 플러그인만
	// 배선하면 충분하다.
	id 'com.google.protobuf' version '0.9.4'
}

group = 'com.fdsv2'
version = '0.0.1-SNAPSHOT'
description = 'FDS v2 backend (Kafka partitioning verification)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	// Spring Boot 4는 기본적으로 Jackson 3(tools.jackson.*)을 쓰지만, Spring Kafka의
	// JsonSerializer/JsonDeserializer(com.fasterxml.jackson.databind 기반)는 아직 classic
	// Jackson 2 databind를 요구한다 — 없으면 컨슈머 기동 시 NoClassDefFoundError 발생.
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.6'
	// TransactionEvent.occurredAt(Instant) 직렬화/역직렬화를 위한 java.time 지원 모듈.
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.6'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// CP1 프로듀서 TPS/latency를 Prometheus로 수집하기 위함 (docs/PERFORMANCE_MEASUREMENT.md 참고)
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// CP2 — 계좌별 슬라이딩 윈도우 집계 토폴로지 (docs/BACKEND.md CP2 참고). 버전은 명시하지 않고
	// Spring Boot 4.1.1 BOM에 위임 — kafka-clients(spring-boot-starter-kafka가 끌어옴)와 같은
	// 4.2.1로 맞춰져서 버전 충돌이 없다. RocksDB(rocksdbjni)는 kafka-streams가 전이 의존성으로
	// 끌고 오므로 별도 추가 불필요.
	implementation 'org.apache.kafka:kafka-streams'
	// CP3 — 온라인 피처 스토어 (docs/BACKEND.md CP3 참고).
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// CP4 model-client — TorchServe 호출 실패/타임아웃 시 서킷브레이커로 폴백 전환 (ARCHITECTURE.md
	// 4번). Spring Boot의 auto-configuration에 의존하지 않는 core 모듈만 추가 — Boot 4.1이 최신이라
	// resilience4j-spring-boot3 스타터의 auto-configuration이 이 버전과 안 맞을 위험을 피하고,
	// CircuitBreaker를 직접 빈으로 구성한다 (com.fdsv2.modelclient.TorchServeModelInferenceClient 참고).
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
	// CP4 model-client 관측 확장 (backend/model-client-observability) — CircuitBreakerRegistry의
	// 상태/호출 결과/실패율을 Micrometer MeterRegistry에 바인딩한다. Spring Boot auto-configuration에
	// 기대지 않고 io.github.resilience4j.micrometer.tagged.TaggedCircuitBreakerMetrics를 코드에서
	// 직접 등록한다 — resilience4j-circuitbreaker 코어 모듈만 쓰기로 한 결정(build.gradle 위 주석)과
	// 같은 이유.
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
	// (backend/model-client-concurrency-fix) k6 10 VU 동시 부하로 실측한 문제: TorchServe
	// 워커 수보다 훨씬 많은 동시 요청을 그대로 흘려보내면, 초과분이 단일/소수 워커 뒤에서 큐잉되며
	// timeout-ms(300ms)를 넘겨 "가짜 실패"로 서킷브레이커에 잡힌다 — TorchServe/모델은 멀쩡한데
	// 앱이 스스로 과부하를 만든 것. Bulkhead로 TorchServe에 동시에 흘려보내는 호출 수 자체를
	// 실제 배포된 워커 수만큼으로 제한해서, 초과분은 TorchServe까지 가지도 않고 즉시 폴백으로
	// 빠지게 한다(ModelClientConfig 클래스 javadoc, docs/sessions 세션 로그 참고).
	implementation 'io.github.resilience4j:resilience4j-bulkhead:2.2.0'
	// (backend/model-client-grpc-benchmark) TorchServe gRPC 추론 API 클라이언트 — REST
	// (RestClientTorchServeHttpCaller)와 동일한 TorchServeHttpCaller 인터페이스를 구현하는
	// GrpcTorchServeHttpCaller에서만 쓰인다. grpc-netty-shaded는 별도 netty 의존성 충돌(Spring
	// WebFlux 등)을 피하려고 shaded 버전을 쓴다 — 이 프로젝트는 WebMVC(서블릿)라 충돌 여지는
	// 적지만, TorchServe 공식 예제/문서가 shaded를 표준으로 쓰므로 그대로 따른다.
	// 버전을 1.83.1로 고정한 이유: Spring Boot 4.1.1의 관리 의존성(io.spring.dependency-management)이
	// io.grpc/protobuf-java 좌표를 이미 이 버전대로 강제하고 있어서(Spring Boot 4가 gRPC를 1급으로
	// 지원하기 시작한 영향으로 추정), 낮은 버전(1.68.1)을 선언해도 실제로는 조용히 1.83.1로
	// 끌어올려졌다 — 그 상태에서 protoc-gen-grpc-java 1.68.1로 생성한 스텁을 실행하니
	// `AbstractMethodError`가 났다(코드 생성 시점 gRPC API 형태와 런타임에 실제로 깔리는 gRPC API
	// 형태가 어긋난 것). "선언한 버전"과 "실제로 도는 버전"을 명시적으로 일치시켜 이 문제를 없앴다.
	implementation 'io.grpc:grpc-netty-shaded:1.83.1'
	implementation 'io.grpc:grpc-protobuf:1.83.1'
	implementation 'io.grpc:grpc-stub:1.83.1'
	// 위와 같은 이유로 protobuf-java도 실제 런타임에 깔리는 버전(4.35.1)을 명시적으로 선언 —
	// 선언 안 해도 어차피 이 버전으로 끌어올려지지만, 숨겨진 강제 승격에 기대지 않고 protoc
	// 컴파일러 버전(아래 protobuf{} 블록)과 맞춰 명시해 둔다.
	implementation 'com.google.protobuf:protobuf-java:4.35.1'
	// inference.proto가 import하는 google/rpc/status.proto의 실제 정의.
	implementation 'com.google.api.grpc:proto-google-common-protos:2.41.0'
	// grpc-stub이 생성하는 코드의 @Generated 애너테이션에 필요 (JDK 9+에서 javax.annotation이
	// 빠지면서 별도 의존성으로 추가해야 함).
	compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// CP2 토폴로지를 브로커 없이 검증하기 위한 TopologyTestDriver.
	testImplementation 'org.apache.kafka:kafka-streams-test-utils'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// (backend/model-client-grpc-benchmark) src/main/proto/inference.proto -> Java 메시지/gRPC 스텁 생성.
// protoc/grpc-java 플러그인 버전은 실제 런타임에 깔리는 io.grpc/protobuf-java 버전(위 dependencies
// 블록 주석 참고, 1.83.1/4.35.1)과 반드시 맞춘다 — 버전이 어긋나면 생성된 스텁이 런타임 클래스와
// ABI가 안 맞아 AbstractMethodError 등으로 실패한다(실제로 겪은 문제, GrpcTorchServeHttpCallerTest
// 참고).
protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.35.1'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1'
		}
	}
	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}
